# On temurin, the GraalVM polyglot engine of test:clj warns about JVMCI
# and runs interpreted, which is expected.
#
# No Windows job: lazy_context_test runs `clojure` as a subprocess, and
# ProcessBuilder does not resolve it to clojure.cmd.

name: CI

on:
  push:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (clj-kondo + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Clojure and Babashka
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          bb: latest
          cli: latest
          clj-kondo: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Setup Clojure cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: clojure-deps-lint-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: clojure-deps-lint-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-lint-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-lint-

      - name: Run lint
        run: bb lint

  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux amd64
            key: linux
          - os: macos-latest
            name: macOS arm64
            key: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Clojure and Babashka
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          bb: latest
          cli: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      # The zig of flake.lock. Without zig and llvm-readobj, bb test:bb
      # skips its zig tests.
      - name: Setup Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Put llvm-readobj on the PATH
        if: runner.os == 'Linux'
        run: |
          for d in /usr/lib/llvm-*/bin; do
            if [ -x "$d/llvm-readobj" ]; then echo "$d" >> "$GITHUB_PATH"; fi
          done

      - name: Setup Clojure cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: clojure-deps-${{ matrix.key }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: clojure-deps-${{ matrix.key }}-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ matrix.key }}-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-${{ matrix.key }}-

      - name: Run JVM tests
        run: bb test:clj

      - name: Run CLJS tests
        run: bb test:cljs

      - name: Run build helper tests
        run: bb test:bb

  ci-pass:
    name: CI Pass
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
